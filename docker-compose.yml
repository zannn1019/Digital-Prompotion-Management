# The app and its PostgreSQL database. All data is in the database and the uploads volume, so restarts and
# redeploys keep it. Run one app container: login lockouts, rate limits and the tap dedupe window live in its memory.
services:
  app:
    build: .
    image: poster-nfc:latest
    restart: unless-stopped
    init: true
    # Settings: copy .env.example to .env and fill it in (see DEPLOY.md).
    env_file: .env
    environment:
      NUXT_DATABASE_URL: postgres://poster:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/poster_nfc
    # Uploaded posters, brochures and logos. Back this volume up together with the database.
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # Only the host's own Nginx reaches the app. 127.0.0.1 also keeps Docker from
    # opening the port past the firewall. APP_PORT changes the host port if 3000 is taken.
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poster_nfc
      POSTGRES_USER: poster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # The data survives restarts and redeploys. Back it up with pg_dump (see DEPLOY.md).
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only the app container reaches the database.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poster -d poster_nfc']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    logging: *logging

volumes:
  pgdata:
  uploads:
