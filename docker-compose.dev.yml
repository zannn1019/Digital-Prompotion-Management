# Local development: only the database, reachable from your PC on 127.0.0.1:5432.
#   docker compose -f docker-compose.dev.yml up -d
# Then in .env: NUXT_DATABASE_URL=postgres://poster:poster@127.0.0.1:5432/poster_nfc
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poster_nfc
      POSTGRES_USER: poster
      POSTGRES_PASSWORD: poster
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poster -d poster_nfc']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
