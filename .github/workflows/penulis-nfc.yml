# Builds the Penulis NFC helper (tools/penulis-nfc) for Windows and macOS whenever it changes.
# A Mac app must be compiled on a Mac, so this runs on GitHub's macOS machines. The results are attached to
# the run as "penulis-nfc" (PenulisNFC.exe + PenulisNFC-mac.zip): copy them into public/downloads and commit.
name: Penulis NFC

on:
  push:
    paths:
      - 'tools/penulis-nfc/**'
      - '.github/workflows/penulis-nfc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/penulis-nfc/go.mod
          cache-dependency-path: tools/penulis-nfc/go.sum
      - name: macOS app (Apple Silicon + Intel)
        run: sh tools/penulis-nfc/build-mac.sh
      - name: Windows exe
        working-directory: tools/penulis-nfc
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o ../../public/downloads/PenulisNFC.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: penulis-nfc
          path: |
            public/downloads/PenulisNFC.exe
            public/downloads/PenulisNFC-mac.zip
          if-no-files-found: error
